name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Verify tag and package version
        run: |
          package_version=$(bun -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$package_version"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve image tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags="ghcr.io/${{ github.repository }}:${version}"
          if [[ "$version" != *-* ]]; then
            tags="$tags,ghcr.io/${{ github.repository }}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push the release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_flags=()
          if [[ "$version" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "Wirebot $version" \
            --notes "Container image: \`ghcr.io/${{ github.repository }}:${version}\`" \
            "${release_flags[@]}"
