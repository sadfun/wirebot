name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Vitest runs under Node while the product runtime is Bun; the compile
      # smoke below exercises the shipped runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run compile
      - name: Compiled binary smoke test
        run: |
          test "$(./dist/wirebot version)" = "$(bun -p 'require("./package.json").version')"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
